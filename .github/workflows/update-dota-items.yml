name: Update Dota item snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dota-item-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh current-patch snapshot
        id: refresh
        run: npm run data:dota:refresh

      - name: Validate data and product
        run: |
          npm run data:dota:validate
          npm test
          npm run build

      - name: Detect snapshot change
        id: changes
        run: |
          if git diff --quiet -- src/data/snapshots/dota-items-7.41e.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish automation branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/dota-item-snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" || true
          git switch -C "$BRANCH"
          git add src/data/snapshots/dota-items-7.41e.json
          git commit -m "chore(data): refresh Dota item snapshot"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update snapshot PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/dota-item-snapshot
        run: |
          number="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Automated current-patch Dota item snapshot refresh. Validation, tests and the static production build passed in this workflow. Main is not updated automatically."
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore(data): refresh Dota item snapshot" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "chore(data): refresh Dota item snapshot" --body "$body"
          fi

      - name: Report unchanged snapshot
        if: steps.changes.outputs.changed != 'true'
        run: echo "The current-patch snapshot is unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed refresh or validation
        if: failure()
        run: |
          echo "## Dota snapshot workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step for an upstream outage, a changed patch boundary, a validation error, or a branch/PR publishing failure. A failed retrieval never advances the saved collection date. Production is never updated by this workflow; a successful snapshot PR still requires review." >> "$GITHUB_STEP_SUMMARY"
